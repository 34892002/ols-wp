docRoot                   $VH_ROOT/doc/
enableGzip                1

errorlog $VH_ROOT/logs/error.log {
# 优化：useServer 0 独立记录日志（参考 demyx）
  useServer               0
  logLevel                DEBUG
  rollingSize             10M
}

accesslog $VH_ROOT/logs/access.log {
  useServer               0
# 优化：logHeaders 7 增加日志详细记录
  logHeaders              7
  rollingSize             10M
  keepDays                30
  compressArchive         0
}

index  {
# 优化：增加 index.php，这是 WP 运行的前提
  useServer               1
  indexFiles              index.html, index.php
  autoIndex               0
  autoIndexURI            /_autoindex/default.php
}

errorpage 404 {
  url                     /error404.html
}

expires  {
  enableExpires           1
}

phpIniOverride  {
php_admin_value date.timezone           Asia/Shanghai
php_admin_value max_execution_time      300
php_admin_value memory_limit            256M
php_admin_value post_max_size           256M
php_admin_value upload_max_filesize     256M
}

accessControl  {
  allow                   *
}

realm SampleProtectedArea {

  userDB  {
    location              conf/vhosts/$VH_NAME/htpasswd
    maxCacheSize          200
    cacheTimeout          60
  }

  groupDB  {
    location              conf/vhosts/$VH_NAME/htgroup
    maxCacheSize          200
    cacheTimeout          60
  }
}

context / {
  location                $DOC_ROOT/
  allowBrowse             1

# 优化：添加安全响应头，提升网站安全性 BCP
  extraHeaders            <<<END_extraHeaders
Access-Control-Allow-Origin *
    Feature-Policy "geolocation 'self'; midi 'self'; sync-xhr 'self'; microphone 'self'; camera 'self'; magnetometer 'self'; gyroscope 'self'; speaker 'self'; fullscreen 'self'; payment 'self'; usb 'self'"
    Referrer-Policy strict-origin-when-cross-origin
    Strict-Transport-Security max-age=31536000; preload; includeSubDomains; always
    X-Content-Type-Options nosniff; always
    X-Download-Options noopen
    X-Frame-Options SAMEORIGIN
    X-Powered-By OLS-Optimized
    X-XSS-Protection 1; mode=block
  END_extraHeaders


  rewrite  {
    enable                1
# 优化：集成安全防护规则
AddDefaultCharset UTF-8

      # 拦截空 User Agent
      <IfModule LiteSpeed>
          RewriteEngine On
          RewriteCond %{HTTP_USER_AGENT} ^-$
          RewriteRule ^ - [F]
      </IfModule>

      # 拦截恶意爬虫和扫描工具
      <IfModule LiteSpeed>
          RewriteEngine On
          RewriteCond %{HTTP_USER_AGENT} ^.*(?:acunetix|BLEXBot|domaincrawler\.com|LinkpadBot|MJ12bot/v|majestic12\.co\.uk|AhrefsBot|TwengaBot|SemrushBot|nikto|winhttp|Xenu\s+Link\s+Sleuth|Baiduspider|HTTrack|clshttp|harvest|extract|grab|miner|python-requests).*$ [NC]
          RewriteRule .* - [F,L]
      </IfModule>

      # 禁止访问隐藏文件、备份文件、敏感文档及 XMLRPC
      <IfModule LiteSpeed>
          RewriteEngine On
          RewriteBase /
          RewriteRule (^\.) - [F,L]
          RewriteRule ^(readme|license|legalnotice|example|installation|changelog|README|LICENSE|LEGALNOTICE|EXAMPLE|INSTALLATION|CHANGELOG)\.(txt|html|md)$ - [F,L]
          RewriteRule \.(old|orig|original|php#|php~|php_bak|save|swo|aspx?|tpl|sh|bash|bak?|cfg|cgi|dll|exe|git|hg|ini|jsp|log|mdb|out|sql|svn|swp|tar|rdf)$ - [F,L]
          RewriteRule ^xmlrpc.php - [F,L]
          RewriteRule ^wp-content/uploads/[^/]+\.php$ - [F,L]
          RewriteRule (&pws=0|_vti_|\(null\)|\{$itemURL\}|echo(.*)kae|boot\.ini|etc/passwd|eval\(|self/environ|cgi-|muieblack) - [F,L]
          RewriteRule \.(psd|cmd|bat|csh)$ - [F,L]
      </IfModule>

      # 保护 WordPress 核心目录敏感文件
      <IfModule LiteSpeed>
          RewriteEngine On
          RewriteBase /
          RewriteRule ^wp-admin/includes/ - [F,L]
          RewriteRule !^wp-includes/ - [S=3]
          RewriteRule ^wp-includes/[^/]+\.php$ - [F,L]
          RewriteRule ^wp-includes/js/tinymce/langs/.+\.php - [F,L]
          RewriteRule ^wp-includes/theme-compat/ - [F,L]
          RewriteRule ^wp-includes/[^/]+\.xml$ - [F,L]
      </IfModule>

      # 防止用户枚举和脚本注入
      RewriteCond %{QUERY_STRING} author=d
      RewriteRule ^ /? [L,R=301]

      <IfModule LiteSpeed>
          RewriteCond %{QUERY_STRING} (<|%3C).*script.*(>|%3E) [NC,OR]
          RewriteCond %{QUERY_STRING} GLOBALS(=|[|%[0-9A-Z]{0,2}) [OR]
          RewriteCond %{QUERY_STRING} _REQUEST(=|[|%[0-9A-Z]{0,2})
          RewriteRule ^(.*)$ index.php [F,L]
      </IfModule>

      # 标准 WordPress 伪静态规则
      RewriteEngine On
      RewriteBase /
      RewriteRule ^index\.php$ - [L]
      RewriteCond %{REQUEST_FILENAME} !-f
      RewriteCond %{REQUEST_FILENAME} !-d
      RewriteRule . /index.php [L]
  }
}

context /docs/ {
  location                $SERVER_ROOT/docs/
  allowBrowse             1
}

context /protected/ {
  location                protected/
  allowBrowse             1
  realm                   SampleProtectedArea
  authName                Protected
  required                user           test

  accessControl  {
    allow                 *
  }
}

context /blocked/ {
  allowBrowse             0
}

context /cgi-bin/ {
  type                    cgi
  location                $VH_ROOT/cgi-bin/
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
  logLevel                0
}

module cache {
checkPrivateCache       1
checkPublicCache        1
maxCacheObjSize         10000000
maxStaleAge             200
qsCache                 1
reqCookieCache          1
respCookieCache         1
ignoreReqCacheCtrl      1
ignoreRespCacheCtrl     0
enableCache             0
expireInSeconds         3600
enablePrivateCache      0
privateExpireInSeconds  3600
  ls_enabled              0
}
